function energy(p){p=clamp(p,0,100);let i=Math.floor(p);return E[i]+(E[Math.min(100,i+1)]-E[i])*(p-i)}function pct(e){if(e<=E[0])return 0;if(e>=E[100])return 100;let i=1;while(E[i]<e)i++;return i-1+(e-E[i-1])/(E[i]-E[i-1])}
const conditionSpeeds=[70,85,95,110,120],conditionFactors={summer:[-.8,-.9,-1,-1.1,-1.2],wet:[1,1.5,1.9,2.5,3],snow:[2.6,3.4,4,4.9,5.5],slush:[3,4.2,5.1,6.5,7.5]};
function conditionAt(key,speed){const a=conditionFactors[key];if(!a)return 0;const s=clamp(speed,70,120);let i=1;while(i<4&&conditionSpeeds[i]<s)i++;return a[i-1]+(a[i]-a[i-1])*(s-conditionSpeeds[i-1])/(conditionSpeeds[i]-conditionSpeeds[i-1])}

function values(){return routePanel()+'<section><div class="grid">'+field('start','Start %',v.start)+field('target','Mål %',v.target)+'</div>'+'<small class="quicklabel">Start %</small>'+quick('start',[100,90,80,75,70,60])+'<small class="quicklabel">Mål %</small>'+quick('target',[0,5,10,15,20,25])+(v.target===0?'<p class="neg">Planera laddmarginal – 0 % är inte ett säkert ankomstmål.</p>':'')+'<div class="grid">'+field('km','Sträcka km',v.km)+field('mil','Sträcka mil',v.km/10,'number','step=".1"')+'</div>'+field('cons','Förbrukning kWh/100 km',v.cons,'number','step=".1" '+(v.auto?'disabled':''))+'<small>'+fmt(v.cons/10,2)+' kWh/mil</small><label><input type="checkbox" name="auto" '+(v.auto?'checked':'')+'> Beräkna förbrukning automatiskt</label><small class="autohelp '+(v.auto?'pos':'')+'">'+(v.auto?'Aktiv – anpassas efter körförhållanden och tidigare körningar.':'Manuellt läge – du anger själv förbrukningen.')+'</small>'+field('note','Resenamn',v.note,'text')+'<button class="primary" data-tab="1">Visa resultat</button></section><section><h2>Körförhållanden</h2>'+field('speed','Hastighet km/h',v.speed)+quick('speed',[70,85,90,95,100,110,120])+impact('speed')+sel('tires','Däck',v.tires,tires)+impact('tires')+sel('road','Väglag',v.road,roads)+impact('road')+field('ambient','Utetemperatur °C',v.ambient)+quick('ambient',[-12,-3,5,20])+impact('ambient')+field('cabin','Kupétemperatur °C',v.cabin)+quick('cabin',[15,18,20,22])+impact('cabin')+'<p>Däck och väglag anpassas efter hastigheten (modellvärden 70–120 km/h, interpolerade däremellan och begränsade till ändvärden utanför intervallet). Kupévärme anpassas efter restid. Varje effekt jämförs separat med referensen. Kilometer ska inte summeras.</p><div class="big">'+fmt(suggestion()/10,2)+' kWh/mil</div><p>Beräknad räckvidd '+fmt(range(suggestion()),0)+' km · '+learn().n+' matchande resor</p><button data-action="apply">Använd förslag</button> <button data-action="defaults">Standardvärden</button></section>'}
function chargeTime(kwh,kw){let m=Math.round(kwh/kw*60);return m>=60?Math.floor(m/60)+' tim '+m%60+' min':m+' min'}function chargePanel(missing){if(missing<=0)return '<div class="charge"><h2 class="pos">Ingen extra laddning krävs</h2><small>Du når målprocenten enligt modellen.</small></div>';return '<div class="charge"><h2 class="neg">Laddning krävs</h2><small>Extra energi för att nå önskad målprocent</small><div class="big">'+fmt(missing,2)+' kWh</div><h3>Beräknad laddningstid</h3>'+[['Vanligt uttag',2],['16 A laddning',3.4],['Typ 2',6],['CHAdeMO',35]].map(([label,kw])=>'<div class="charge-row"><div>'+label+'<small>'+fmt(kw,1)+' kW nettoeffekt</small></div><strong>'+chargeTime(missing,kw)+'</strong></div>').join('')+'<p>Uppskattade tider. Faktisk effekt varierar. Ladda innan räckvidden tar slut.</p></div>'}function results(){let used=v.km*v.cons/100,left=energy(v.start)-used,missing=Math.max(0,energy(v.target)-left),p=pct(left);return '<section><small>Beräknad ankomst</small><div class="big '+(left<E[0]?'neg':left<energy(v.target)?'warn':'pos')+'">'+fmt(p,0)+' %</div><p>'+(left<E[0]?'Räckvidden räcker inte enligt modellen.':fmt(left-E[0],2)+' kWh till visade 0 %')+'</p><div class="grid"><article>Räckvidd<div class="big">'+fmt(range(v.cons),0)+' km</div></article><article>Resans energi<div class="big">'+fmt(used,2)+' kWh</div></article></div><p>Förbrukning '+fmt(v.cons/10,2)+' kWh/mil. Marginal till mål: '+fmt(left-energy(v.target),2)+' kWh.</p>'+chargePanel(missing)+'</section><section><h2>Känslighetsanalys</h2><table><tr><th>kWh/mil</th><th>Ankomst %</th><th>Räckvidd km</th></tr>'+Array.from({length:11},(_,i)=>{let c=15+i;return '<tr><td>'+fmt(c/10,1)+'</td><td>'+fmt(pct(energy(v.start)-v.km*c/100),0)+'</td><td>'+fmt(range(c),0)+'</td></tr>'}).join('')+'</table><p>Modellvärden, inte garanti för faktisk räckvidd. Planera laddmarginal.</p></section>'}

function render(){if(v.auto)v.cons=suggestion();nav.innerHTML=names.map((n,i)=>'<button data-tab="'+i+'" class="'+(tab===i?'active':'')+'">'+n+'</button>').join('');app.innerHTML=[values,results,()=>logs(true),()=>logs(false),table,dataPage][tab]();save();saveRoute();mountRouteMap()}
function change(el){let k=el.name;if(!k)return;if(k==='km'||k==='mil')routePlan=null;if(k==='auto')v.auto=el.checked;else if(k==='mil'){if(el.value!=='')v.km=Math.max(0,Number(el.value)*10)}else if(k in v){if(el.type==='number'){if(el.value===''||!Number.isFinite(Number(el.value)))return;let limits={start:[0,100],target:[0,100],km:[0,10000],cons:[.1,100],speed:[20,150],ambient:[-40,45],cabin:[10,30]};v[k]=clamp(Number(el.value),...limits[k]);if(k==='cons')v.auto=false}else v[k]=el.value}save()}

function routeTime(){return routePlan.segments.reduce((a,s)=>a+s.km/routeSpeed(s),0)*60}
function decodeShape(str){let i=0,lat=0,lon=0,out=[];while(i<str.length){let pair=[];for(let j=0;j<2;j++){let n=0,shift=0,b;do{if(i>=str.length||shift>30)throw Error('Ogiltig kartlinje');b=str.charCodeAt(i++)-63;n|=(b&31)<<shift;shift+=5}while(b>=32);pair.push(n&1?~(n>>1):n>>1)}lat+=pair[0];lon+=pair[1];out.push([lat/1e6,lon/1e6])}return out}
function routeMap(){try{let lines=(routePlan.shapes||[]).map(decodeShape),pts=lines.flat();if(!pts.length)return '';let ys=pts.map(p=>p[0]),xs=pts.map(p=>p[1]),lo=Math.min(...xs),hi=Math.max(...xs),bot=Math.min(...ys),top=Math.max(...ys),cos=Math.cos((top+bot)*Math.PI/360),scale=Math.min(300/Math.max(.00001,(hi-lo)*cos),200/Math.max(.00001,top-bot)),xy=p=>[170+(p[1]-(hi+lo)/2)*cos*scale,120-(p[0]-(top+bot)/2)*scale];let a=xy(pts[0]),b=xy(lines[0].at(-1));return '<div id="leafroute-map" style="height:250px;border-radius:10px;overflow:hidden;background:#172a40"><svg viewBox="0 0 340 240" width="100%" height="100%" aria-label="Färdvägens form">'+lines.map(l=>'<polyline fill="none" stroke="#38bdf8" stroke-width="3" points="'+l.map(p=>xy(p).join(',')).join(' ')+'"/>').join('')+'<circle cx="'+a[0]+'" cy="'+a[1]+'" r="5" fill="#67e8a5"/><circle cx="'+b[0]+'" cy="'+b[1]+'" r="5" fill="#fca5a5"/></svg></div><small>Grön: start · röd: destination. © OpenStreetMap contributors</small>'}catch{return ''}}
let mapInstance=null;
function mountRouteMap(){if(mapInstance){mapInstance.remove();mapInstance=null}let el=document.getElementById('leafroute-map');if(!el||!window.L||!routePlan)return;try{let lines=routePlan.shapes.map(decodeShape);el.innerHTML='';mapInstance=L.map(el,{scrollWheelZoom:false});L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(mapInstance);let layer=L.polyline(lines,{color:'#0284c7',weight:5}).addTo(mapInstance);L.marker(lines[0][0]).addTo(mapInstance).bindPopup('Start');L.marker(lines[0].at(-1)).addTo(mapInstance).bindPopup('Destination');mapInstance.fitBounds(layer.getBounds(),{padding:[20,20]})}catch{}}

function routePanel(){return '<section id="routepanel"><h2>Automatisk färdplanering</h2><p>Hastighetsgränser från OpenStreetMap. Testtjänst, internet krävs.</p><label>Startplats<input id="routefrom" value="'+esc(routePrefs.from)+'" placeholder="Vansbro"></label><label>Destination<input id="routeto" value="'+esc(routePrefs.to)+'" placeholder="Mora"></label><label><input type="checkbox" id="routeround" '+(routePrefs.round?'checked':'')+'> Tur och retur</label><label>Körprofil<select id="routeoffset">'+[-10,-5,0,5,10].map(n=>'<option value="'+n+'" '+(n===routePrefs.offset?'selected':'')+'>'+(n===0?'Enligt skyltning':n<0?Math.abs(n)+' km/h under':n+' km/h över (simulering)')+'</option>').join('')+'</select></label><button id="routecalc" class="primary" '+(routeBusy?'disabled':'')+'>Beräkna färdväg</button><div id="routestatus">'+(routePlan?routeSummary():'')+'</div><p>Följ alltid gällande hastighetsgränser. Kartdata kan vara felaktiga.</p></section>'}
function routeSummary(){let p=routePlan;return '<p>'+fmt(p.km,1)+' km · '+fmt(routeTime(),0)+' min (utan stopp) · '+fmt(p.km/routeTime()*60,1)+' km/h rullande snitt</p><small>Karttjänstens restid: '+fmt(p.minutes,0)+' min</small>'+routeMap()+'<table><tr><th>Skyltning</th><th>km</th></tr>'+Object.entries(p.groups).sort((a,b)=>Number(a[0])-Number(b[0])).map(([k,d])=>'<tr><td>'+esc(k)+' km/h</td><td>'+fmt(d,1)+'</td></tr>').join('')+'</table><p>'+fmt(p.unknown,1)+' km saknar verifierad skyltning. Dessa använder uppskattad väghastighet eller manuellt hastighetsvärde.</p><p>Modell: '+fmt(routeConsumption()/10,2)+' kWh/mil</p><button id="routeclear">Ta bort färdväg</button>'}
function routeConsumption(){if(!routePlan)return Math.max(9,base(v)+learn().delta);let total=0;for(const s of routePlan.segments){let speed=routeSpeed(s);total+=s.km*Math.max(9,base({...v,speed}));}return total/routePlan.km}
async function routeJSON(url){const res=await fetch(url,{signal:AbortSignal.timeout(25000)});if(!res.ok)throw Error('Karttjänsten svarade '+res.status);return res.json()}
async function locatePlace(q){let a=await routeJSON('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=3&countrycodes=se&q='+encodeURIComponent(q));if(!a.length)throw Error('Hittar inte '+q);if(a.length>1){let choice=prompt('Välj plats för '+q+':\n'+a.map((x,i)=>(i+1)+'. '+x.display_name).join('\n'),'1');if(choice===null||!a[Number(choice)-1])throw Error('Inget platsval');a=[a[Number(choice)-1]]}return {lat:Number(a[0].lat),lon:Number(a[0].lon)}}
async function fetchLeg(a,b){const host='https://valhalla1.openstreetmap.de';let req={locations:[a,b],costing:'auto',units:'kilometers'};let r=await routeJSON(host+'/route?json='+encodeURIComponent(JSON.stringify(req)));let leg=r.trip?.legs?.[0];if(!leg?.shape)throw Error('Ingen färdväg hittades');let trace={encoded_polyline:leg.shape,shape_match:'edge_walk',costing:'auto',units:'kilometers',filters:{action:'include',attributes:['edge.length','edge.speed','edge.speed_limit']}};let t=await routeJSON(host+'/trace_attributes?json='+encodeURIComponent(JSON.stringify(trace)));if(!Array.isArray(t.edges)||!t.edges.length)throw Error('Inga vägavsnitt returnerades');let segments=t.edges.filter(e=>Number(e.length)>0).map(e=>({km:Number(e.length),limit:Number(e.speed_limit)>0&&Number(e.speed_limit)<255?Number(e.speed_limit):null,speed:Number(e.speed_limit)>0&&Number(e.speed_limit)<255?Number(e.speed_limit):Number(e.speed)||null}));let sum=segments.reduce((s,e)=>s+e.km,0);if(!sum||Math.abs(sum-leg.summary.length)>Math.max(1,leg.summary.length*.05))throw Error('Vägavsnittens längd stämmer inte med rutten');return {segments,minutes:leg.summary.time/60,shapes:[leg.shape]}}
document.addEventListener('input',e=>{let k={routefrom:'from',routeto:'to',routeoffset:'offset',routeround:'round'}[e.target.id];if(k){routePrefs[k]=k==='offset'?Number(e.target.value):k==='round'?e.target.checked:e.target.value;if(k!=='offset')routePlan=null;saveRoute();if(k==='offset'||k==='round')refreshValues();else if(k==='from'||k==='to'){let status=document.getElementById('routestatus');if(status)status.textContent='Beräkna ny färdväg';if(v.auto)v.cons=suggestion()}}});
document.addEventListener('click',async e=>{if(e.target.id==='routeclear'){routePlan=null;render();return}if(e.target.id!=='routecalc'||routeBusy)return;if(!routePrefs.from.trim()||!routePrefs.to.trim()){alert('Ange startplats och destination');return}routeBusy=true;routePlan=null;saveRoute();e.target.disabled=true;document.getElementById('routestatus').textContent='Hämtar färdväg…';try{let a=await locatePlace(routePrefs.from);await new Promise(r=>setTimeout(r,1100));let b=await locatePlace(routePrefs.to);let l=await fetchLeg(a,b);if(routePrefs.round){let back=await fetchLeg(b,a);l.segments.push(...back.segments);l.minutes+=back.minutes;l.shapes.push(...back.shapes)}let groups={},unknown=0,km=0;for(let s of l.segments){km+=s.km;if(s.limit)groups[s.limit]=(groups[s.limit]||0)+s.km;else unknown+=s.km}routePlan={...l,groups,unknown,km};v.km=km;v.auto=true;v.note=routePrefs.from+' – '+routePrefs.to;render()}catch(err){let el=document.getElementById('routestatus');if(el)el.textContent='Kunde inte hämta färdväg: '+err.message+' . Använd manuella värden.'}finally{routeBusy=false;let b=document.getElementById('routecalc');if(b)b.disabled=false}});

render();
const APP_VERSION='6.2';
let updateBusy=false;
async function checkUpdate(manual=false){if(updateBusy)return;updateBusy=true;try{const u=new URL(location.href);u.searchParams.set('_check',Date.now());const response=await fetch(u.href,{cache:'no-store'});if(!response.ok)throw Error();const html=await response.text();const match=html.match(/<title>Min Leaf ([0-9.]+)<\/title>/);if(!match)throw Error();if(match[1].localeCompare(APP_VERSION,undefined,{numeric:true})>0){save();if(document.getElementById('logform')||document.activeElement?.matches('input,textarea,select')){if(!confirm('Ny version '+match[1]+' finns. Uppdatera nu? Osparade formulär kan försvinna.'))return}u.searchParams.delete('_check');u.searchParams.set('v',match[1]);u.searchParams.set('_reload',Date.now());location.replace(u.href)}else if(manual)alert('Du har senaste versionen: '+APP_VERSION)}catch(e){if(manual)alert('Kunde inte kontrollera uppdateringar. Försök igen när du har internet.')}finally{updateBusy=false}}
const updateButton=document.createElement('button');updateButton.textContent='Sök efter uppdatering';updateButton.style.cssText='display:block;margin:20px auto;font-size:14px';updateButton.addEventListener('click',()=>checkUpdate(true));app.after(updateButton);checkUpdate();document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});window.addEventListener('pageshow',()=>checkUpdate());
</script></body></html>
