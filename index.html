let routePlan=null, routeBusy=false;
const routePrefs={from:'',to:'',offset:0,round:false};
try{const saved=JSON.parse(localStorage.getItem('leaf-route-v1'));if(saved){Object.assign(routePrefs,saved.prefs);if(saved.plan?.segments?.length&&saved.plan.km>0){routePlan=saved.plan;v.km=routePlan.km}}}catch{}
function saveRoute(){try{localStorage.setItem('leaf-route-v1',JSON.stringify({prefs:routePrefs,plan:routePlan}))}catch{}}
function routeSpeed(s){return clamp((s.speed||v.speed)+routePrefs.offset,20,150)}
function routeTime(){return routePlan.segments.reduce((a,s)=>a+s.km/routeSpeed(s),0)*60}
function decodeShape(str){let i=0,lat=0,lon=0,out=[];while(i<str.length){let pair=[];for(let j=0;j<2;j++){let n=0,shift=0,b;do{if(i>=str.length||shift>30)throw Error('Ogiltig kartlinje');b=str.charCodeAt(i++)-63;n|=(b&31)<<shift;shift+=5}while(b>=32);pair.push(n&1?~(n>>1):n>>1)}lat+=pair[0];lon+=pair[1];out.push([lat/1e6,lon/1e6])}return out}
function routeMap(){try{let lines=(routePlan.shapes||[]).map(decodeShape),pts=lines.flat();if(!pts.length)return '';let ys=pts.map(p=>p[0]),xs=pts.map(p=>p[1]),lo=Math.min(...xs),hi=Math.max(...xs),bot=Math.min(...ys),top=Math.max(...ys),cos=Math.cos((top+bot)*Math.PI/360),scale=Math.min(300/Math.max(.00001,(hi-lo)*cos),200/Math.max(.00001,top-bot)),xy=p=>[170+(p[1]-(hi+lo)/2)*cos*scale,120-(p[0]-(top+bot)/2)*scale];let a=xy(pts[0]),b=xy(lines[0].at(-1));return '<div id="leafroute-map" style="height:250px;border-radius:10px;overflow:hidden;background:#172a40"><svg viewBox="0 0 340 240" width="100%" height="100%" aria-label="Färdvägens form">'+lines.map(l=>'<polyline fill="none" stroke="#38bdf8" stroke-width="3" points="'+l.map(p=>xy(p).join(',')).join(' ')+'"/>').join('')+'<circle cx="'+a[0]+'" cy="'+a[1]+'" r="5" fill="#67e8a5"/><circle cx="'+b[0]+'" cy="'+b[1]+'" r="5" fill="#fca5a5"/></svg></div><small>Grön: start · röd: destination. © OpenStreetMap contributors</small>'}catch{return ''}}
let mapInstance=null;
function mountRouteMap(){if(mapInstance){mapInstance.remove();mapInstance=null}let el=document.getElementById('leafroute-map');if(!el||!window.L||!routePlan)return;try{let lines=routePlan.shapes.map(decodeShape);el.innerHTML='';mapInstance=L.map(el,{scrollWheelZoom:false});L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(mapInstance);let layer=L.polyline(lines,{color:'#0284c7',weight:5}).addTo(mapInstance);L.circleMarker(lines[0][0],{radius:7,color:'#fff',weight:2,fillColor:'#16a34a',fillOpacity:1}).addTo(mapInstance).bindPopup('Start');L.circleMarker(lines[0].at(-1),{radius:7,color:'#fff',weight:2,fillColor:'#dc2626',fillOpacity:1}).addTo(mapInstance).bindPopup('Destination');mapInstance.fitBounds(layer.getBounds(),{padding:[20,20]})}catch{}}

function routePanel(){return '<section id="routepanel"><h2>Automatisk färdplanering</h2><p>Hastighetsgränser från OpenStreetMap. GPS-position skickas till karttjänsten för adressuppslag. Testtjänst, internet krävs.</p><label>Startplats<input id="routefrom" value="'+esc(routePrefs.from)+'" placeholder="Ange ort eller adress"></label><button type="button" id="routegps" style="width:100%;margin-bottom:8px">📍 Använd min position</button><label>Destination<input id="routeto" value="'+esc(routePrefs.to)+'" placeholder="Ange ort eller adress"></label><label><input type="checkbox" id="routeround" '+(routePrefs.round?'checked':'')+'> Tur och retur</label><label>Körprofil<select id="routeoffset">'+[-30,-25,-20,-15,-10,-5,0,5,10,15,20,25,30].map(n=>'<option value="'+n+'" '+(n===routePrefs.offset?'selected':'')+'>'+(n===0?'Enligt skyltning':n<0?Math.abs(n)+' km/h under':n+' km/h över (simulering)')+'</option>').join('')+'</select></label><button id="routecalc" class="primary" '+(routeBusy?'disabled':'')+'>Beräkna färdväg</button><div id="routestatus">'+(routePlan?routeSummary():'')+'</div><p>Följ alltid gällande hastighetsgränser. Kartdata kan vara felaktiga.</p></section>'}
function routeSummary(){let p=routePlan;return '<p>'+fmt(p.km,1)+' km · '+fmt(routeTime(),0)+' min (utan stopp) · '+fmt(p.km/routeTime()*60,1)+' km/h rullande snitt</p><small>Karttjänstens restid: '+fmt(p.minutes,0)+' min</small>'+routeMap()+'<table><tr><th>Skyltning</th><th>km</th></tr>'+Object.entries(p.groups).sort((a,b)=>Number(a[0])-Number(b[0])).map(([k,d])=>'<tr><td>'+esc(k)+' km/h</td><td>'+fmt(d,1)+'</td></tr>').join('')+'</table><p>'+fmt(p.unknown,1)+' km saknar verifierad skyltning. Dessa använder uppskattad väghastighet eller manuellt hastighetsvärde.</p><p>Modell: '+fmt(suggestion()/10,2)+' kWh/mil</p><button id="routeclear">Ta bort färdväg</button>'}
function routeConsumption(){if(!routePlan)return Math.max(9,base(v)+learn().delta);let total=0;for(const s of routePlan.segments){let speed=routeSpeed(s);total+=s.km*Math.max(9,base({...v,speed})+learn({...v,speed}).delta);}return total/routePlan.km}
async function routeJSON(url,options={},attempts=3){const stage=url.includes('trace_attributes')?'Hastighetsgränser':url.includes('nominatim')?'Platssökning':'Färdväg';let last;for(let i=0;i<attempts;i++){try{const res=await fetch(url,{...options,signal:AbortSignal.timeout(35000)});if(!res.ok){let e=Error('HTTP '+res.status);if(res.status>=400&&res.status<500&&res.status!==429){e.permanent=true;throw e}throw e}return await res.json()}catch(e){last=e;if(e.permanent)break;if(i<attempts-1){let el=document.getElementById('routestatus');if(el)el.textContent=stage+': försöker igen ('+(i+2)+'/'+attempts+')…';await new Promise(r=>setTimeout(r,2000*(i+1)))}}}throw Error(stage+': '+last.message)}
const placeCache=(()=>{try{return JSON.parse(localStorage.getItem('leaf-places-v1'))||{}}catch{return {}}})();
async function locatePlace(q){if(q==='Min aktuella position'&&routePrefs.gps)return routePrefs.gps;const key=q.trim().toLowerCase();if(placeCache[key])return placeCache[key];let a=await routeJSON('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=se&q='+encodeURIComponent(q));if(!a.length)throw Error('Hittar inte '+q);const rank=x=>['city','town','village','hamlet','suburb'].includes(x.addresstype)?0:x.category==='boundary'?2:1;a.sort((x,y)=>rank(x)-rank(y));let chosen=a[0];if(a.length>1){chosen=await new Promise((resolve,reject)=>{let el=document.getElementById('routestatus');if(!el){reject(Error('Platsval avbrutet'));return}el.innerHTML='<h3>Välj plats för '+esc(q)+'</h3>'+a.map((x,i)=>'<button type="button" data-place-choice="'+i+'" style="display:block;width:100%;text-align:left;margin:8px 0">'+esc(x.display_name)+'</button>').join('')+'<button type="button" data-place-choice="-1">Avbryt</button>';el.onclick=e=>{let btn=e.target.closest('[data-place-choice]');if(!btn)return;el.onclick=null;let i=Number(btn.dataset.placeChoice);if(i<0)reject(Error('Platsval avbrutet'));else{el.textContent='Hämtar färdväg…';resolve(a[i])}}})}let p={lat:Number(chosen.lat),lon:Number(chosen.lon)};placeCache[key]=p;try{localStorage.setItem('leaf-places-v1',JSON.stringify(placeCache))}catch{}return p}
async function fetchLeg(a,b){const host='https://valhalla1.openstreetmap.de';let req={locations:[a,b],costing:'auto',units:'kilometers'};let r=await routeJSON(host+'/route?json='+encodeURIComponent(JSON.stringify(req)));let leg=r.trip?.legs?.[0];if(!leg?.shape)throw Error('Ingen färdväg hittades');let trace={encoded_polyline:leg.shape,shape_match:'edge_walk',costing:'auto',units:'kilometers',filters:{action:'include',attributes:['edge.length','edge.speed','edge.speed_limit']}};let segments;try{let t;try{t=await routeJSON(host+'/trace_attributes',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(trace)},1)}catch{t=await routeJSON(host+'/trace_attributes?json='+encodeURIComponent(JSON.stringify(trace)),{},1)}if(!Array.isArray(t.edges)||!t.edges.length)throw Error('Inga vägavsnitt');segments=t.edges.filter(e=>Number(e.length)>0).map(e=>({km:Number(e.length),limit:Number(e.speed_limit)>0&&Number(e.speed_limit)<255?Number(e.speed_limit):null,speed:Number(e.speed_limit)>0&&Number(e.speed_limit)<255?Number(e.speed_limit):Number(e.speed)||null}));let sum=segments.reduce((s,e)=>s+e.km,0);if(!sum||Math.abs(sum-leg.summary.length)>Math.max(1,leg.summary.length*.05))throw Error('Vägavsnittens längd stämmer inte');}catch(err){segments=[{km:leg.summary.length,limit:null,speed:null}];}return {segments,minutes:leg.summary.time/60,shapes:[leg.shape]}}
document.addEventListener('input',e=>{let k={routefrom:'from',routeto:'to',routeoffset:'offset',routeround:'round'}[e.target.id];if(k){if(k==='from')delete routePrefs.gps;routePrefs[k]=k==='offset'?Number(e.target.value):k==='round'?e.target.checked:e.target.value;if(k!=='offset')routePlan=null;saveRoute();if(k==='offset'||k==='round')refreshValues();else if(k==='from'||k==='to'){let status=document.getElementById('routestatus');if(status)status.textContent='Beräkna ny färdväg';if(v.auto)v.cons=suggestion()}}});
document.addEventListener('click',async e=>{if(e.target.id==='routeclear'){routePlan=null;render();return}if(e.target.id!=='routecalc'||routeBusy)return;if(!routePrefs.from.trim()||!routePrefs.to.trim()){alert('Ange startplats och destination');return}routeBusy=true;routePlan=null;saveRoute();e.target.disabled=true;document.getElementById('routestatus').textContent='Hämtar färdväg…';try{let a=routePrefs.gps||await locatePlace(routePrefs.from);await new Promise(r=>setTimeout(r,1100));let b=await locatePlace(routePrefs.to);let l=await fetchLeg(a,b);if(routePrefs.round){let back=await fetchLeg(b,a);l.segments.push(...back.segments);l.minutes+=back.minutes;l.shapes.push(...back.shapes)}let groups={},unknown=0,km=0;for(let s of l.segments){km+=s.km;if(s.limit)groups[s.limit]=(groups[s.limit]||0)+s.km;else unknown+=s.km}routePlan={...l,groups,unknown,km};v.km=km;v.auto=true;v.note=routePrefs.from+' – '+routePrefs.to;render()}catch(err){let el=document.getElementById('routestatus');if(el)el.textContent='Kunde inte hämta färdväg: '+err.message+' . Använd manuella värden.'}finally{routeBusy=false;let b=document.getElementById('routecalc');if(b)b.disabled=false}});

function gpsAddress(j){let a=j.address||{};let road=a.road||a.pedestrian||a.residential||a.footway||'';let numbered=/^[A-ZÅÄÖ]{1,3}\s*\d+[A-Z]?$/i.test(road);let farm=a.farm||a.isolated_dwelling||a.place||a.hamlet||'';let town=a.city||a.town||a.village||a.hamlet||a.municipality||'';let building=a.house_name||a.building||(j.addresstype==='building'||j.addresstype==='house'||j.addresstype==='farm'?j.name:'')||'';let street=[building||(!numbered?road:'')||farm||town||road,a.house_number].filter(Boolean).join(' ');let label=[...new Set([street,town].filter(Boolean))].join(', ');return label||j.display_name||'Min aktuella position'}
document.addEventListener('click',e=>{if(e.target.id!=='routegps')return;if(routeBusy)return;if(!navigator.geolocation){alert('GPS stöds inte i denna webbläsare');return}const btn=e.target;btn.disabled=true;btn.textContent='Hämtar position…';navigator.geolocation.getCurrentPosition(async p=>{let gps={lat:p.coords.latitude,lon:p.coords.longitude};routePrefs.gps=gps;routePrefs.from='Min aktuella position';routePlan=null;saveRoute();render();try{let j=await routeJSON('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=sv&lat='+encodeURIComponent(gps.lat)+'&lon='+encodeURIComponent(gps.lon),{},1);if(routePrefs.gps!==gps||routeBusy)return;routePrefs.from=gpsAddress(j);saveRoute();let input=document.getElementById('routefrom');if(input)input.value=routePrefs.from}catch{}},err=>{btn.disabled=false;btn.textContent='📍 Använd min position';alert('Kunde inte hämta position. Tillåt platsåtkomst eller skriv startplats manuellt. '+err.message)},{enableHighAccuracy:true,timeout:20000,maximumAge:0})});

let updateBusy=false;
async function checkUpdate(manual=false){if(updateBusy)return;updateBusy=true;try{const u=new URL(location.href);u.hash='';u.searchParams.set('_check',Date.now());const response=await fetch(u.href,{cache:'no-store'});if(!response.ok)throw Error();const html=await response.text();const match=html.match(/<title>Min Elbil ([0-9.]+)<\/title>/);if(!match)throw Error();if(match[1].localeCompare(APP_VERSION,undefined,{numeric:true})>0){save();if(document.getElementById('logform')||document.activeElement?.matches('input,textarea,select')){if(!confirm('Ny version '+match[1]+' finns. Uppdatera nu? Osparade formulär kan försvinna.'))return}u.searchParams.delete('_check');u.searchParams.set('v',match[1]);u.searchParams.set('_reload',Date.now());u.hash=location.hash;location.replace(u.href)}else if(manual)alert('Du har senaste versionen: '+APP_VERSION)}catch(e){if(manual)alert('Kunde inte kontrollera uppdateringar. Försök igen när du har internet.')}finally{updateBusy=false}}
